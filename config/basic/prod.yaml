env: prod
mode: basic

data:
  raw_path: "/app/data/basic/01-raw/heart.csv"
  preprocessed_path: "/app/data/basic/02-preprocessed/heart_preprocessed.csv"
  features_path: "/app/data/basic/03-features/heart_features.csv"
  predictions_path: "/app/data/basic/04-predictions/predictions.csv"
  target_column: "target"
  test_size: 0.2
  val_size: 0.1
  random_state: 42

model:
  type: "random_forest"
  save_path: "/app/models/basic/best_model.pkl"
  scaler_path: "/app/models/basic/scaler.pkl"
  feature_columns_path: "/app/models/basic/feature_columns.json"
  params:
    n_estimators: 500
    max_depth: 12
    class_weight: "balanced"
    n_jobs: -1

training:
  cv_folds: 5
  scoring: "roc_auc"

reports:
  figures_dir: "/app/reports/basic/figures"
  metrics_path: "/app/reports/basic/metrics.json"

logging:
  level: "INFO"
