env: local
mode: basic

data:
  raw_path: "data/basic/01-raw/heart.csv"
  preprocessed_path: "data/basic/02-preprocessed/heart_preprocessed.csv"
  features_path: "data/basic/03-features/heart_features.csv"
  predictions_path: "data/basic/04-predictions/predictions.csv"
  target_column: "target"
  test_size: 0.2
  val_size: 0.1
  random_state: 42

model:
  type: "random_forest"
  save_path: "models/basic/best_model.pkl"
  scaler_path: "models/basic/scaler.pkl"
  feature_columns_path: "models/basic/feature_columns.json"
  params:
    n_estimators: 300
    max_depth: 10
    class_weight: "balanced"
    n_jobs: -1

training:
  cv_folds: 5
  scoring: "roc_auc"

reports:
  figures_dir: "reports/basic/figures"
  metrics_path: "reports/basic/metrics.json"

logging:
  level: "DEBUG"
